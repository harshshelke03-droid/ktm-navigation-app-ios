Click Start. Sideloadly will automatically sign the binary and install KTMNav onto your iPhone over the USB cable.

Step 4: Authorize the App on Your iPhone
Before iOS will launch a sideloaded app:

Enable Developer Mode (iOS 16, 17, and 18):

Go to Settings → Privacy & Security → Developer Mode.

Toggle Developer Mode ON, tap Restart, and tap Turn On after rebooting.

Trust Your Personal Certificate:

Go to Settings → General → VPN & Device Management.

Under Developer App, tap your Apple ID email.

Tap Trust "[Your Apple ID]" and confirm.

Step 5: Pair with Your KTM TFT Screen & Ride
Turn on your motorcycle's ignition key.

Using the 4-way handlebar switchgear (left cube), open:Menu → Settings → Bluetooth → Phone → Pairing (or Add Device).

