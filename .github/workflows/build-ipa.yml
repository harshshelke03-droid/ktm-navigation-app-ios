Windows Sideloading Guide
Step 1: Install the Correct Apple USB Drivers on Windows
Windows needs Apple Mobile Device Support (AMDS) drivers to communicate with your iPhone over USB. Do not use the Microsoft Store versions of iTunes or iCloud, as their sandboxing strips out these necessary USB drivers.

Install Standalone iTunes (64-bit): Download and run the official iTunes for Windows Installer.

Install Standalone iCloud: Download and run the official iCloud Direct Setup Package.

Connect Your iPhone:

Plug your iPhone into your Windows laptop via a USB Lightning or USB-C cable.

Unlock your iPhone screen and tap Trust This Computer when prompted, then enter your device passcode.

Open iTunes on Windows to confirm your iPhone icon appears in the top toolbar.

Step 2: Build the KTMNav.ipa (Free via GitHub Cloud Mac Runner)
Because iOS Swift apps require Apple's xcodebuild tool to compile into an .ipa, you can use GitHub Actions' free cloud macOS runners right from your Windows browser:

Create a free account on GitHub.com (if you don't already have one) and create a new repository (e.g., KTMNav-App).

Upload the KTMNavApp files from your updated KTMNav_iOS_Companion.zip archive into the repository.

In your repo, create the file .github/workflows/build-ipa.yml with the following workflow:

YAML
name: Build KTMNav IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package IPA
        run: |
          mkdir -p build/Payload
          xcodebuild build -scheme KTMNav -destination "generic/platform=iOS" -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -exec cp -R {} build/Payload/ \;
          cd build && zip -r KTMNav.ipa Payload/
      - uses: actions/upload-artifact@v4
        with:
          name: KTMNav-IPA
          path: build/KTMNav.ipa
Click on the Actions tab in GitHub, select Build KTMNav IPA, and click Run workflow.

Once complete (~2 minutes), open the finished run, download the KTMNav-IPA.zip artifact to your Windows laptop, and extract it to reveal KTMNav.ipa.

Step 3: Sign & Install via Sideloadly
Download and install Sideloadly for Windows (64-bit).

Open Sideloadly with your iPhone connected via USB. Ensure your iPhone name shows in the iDevice selector.

Drag and drop your KTMNav.ipa file onto the large IPA icon on the left side of Sideloadly.

