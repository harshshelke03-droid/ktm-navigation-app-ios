Part 1: How to Install It on Your iPhone (Windows Laptop)
Testing And Debugging Guide
Here is the exact step-by-step workflow to get the app running on your iPhone:

Install the Required USB Drivers:

Install the standalone iTunes 64-bit for Windows.

Install the standalone iCloud for Windows Direct Package. (Do not use the Microsoft Store editions, as they lack USB device drivers).

Download & Launch Sideloadly:

Install Sideloadly for Windows.

Connect Your iPhone via USB:

Unlock your iPhone, connect the cable to your laptop, tap Trust This Computer, and enter your passcode.

In Sideloadly, verify your iPhone shows in the iDevice selector.

Sign & Install:

Drag the KTMNav.ipa file into Sideloadly.

Enter your personal Apple ID email address.

Click Start and wait for the Done! confirmation.

Enable Permissions on iPhone:

Turn on Developer Mode: Go to Settings → Privacy & Security → Developer Mode → Turn ON and restart your phone.

Trust Certificate: Go to Settings → General → VPN & Device Management, tap your Apple ID under Developer App, and tap Trust.

Part 2: 7 Potential Bugs to Check Before Riding
Motorcycle Bluetooth implementations (especially KTM's BCCU module) are sensitive to connection timing, packet sizes, and iOS power management. Here are the most common failure points and how to bench-test them while parked:

1. The Ignition-Cycle Reconnect Bug
The Bug: Turning the bike's ignition key off (at a traffic light or petrol pump) drops Bluetooth. Many apps get stuck in a handshake loop when the bike restarts, forcing you to pull off your riding gloves and manually reconnect.

How to Test in the Garage:

Turn the bike ignition ON, connect KTMNav, and start a test route.

Verify the turn arrow appears on the TFT screen.

Switch the key OFF for 10 seconds, then switch it back ON without touching your phone.

Pass Criteria: Within 2–4 seconds of the TFT booting, the Bluetooth symbol must light up and resume displaying the navigation screen automatically.

2. Long Street Name Buffer Overflow
The Bug: KTM TFT dashboards have small hardware string buffers (typically 24–32 bytes). In cities like Mumbai or Pune with long street names (e.g., "Chhatrapati Shivaji Maharaj Marg"), unbuffered UTF-8 strings can freeze the TFT screen or cause glyph distortion.

How to Test:

In KTMNav, search for an address with a long name.

Verify that the app truncates the string cleanly to 32 UTF-8 bytes without malformed character artifacts.

Pass Criteria: The road name displays cleanly on the TFT (e.g., Chhatrapati Shivaji...) without dashboard resets.

3. iOS Background Location Suspension (Locked Screen in Pocket)
The Bug: If iOS throttles or suspends background GPS to save battery, your dash freezes on the last turn distance while you are riding.

Settings Check:

Go to Settings → KTMNav → Location and select Always (with Precise Location ON).

Ensure Low Power Mode (Yellow Battery Icon) is OFF, as it blocks background Bluetooth packet transmission and throttles GPS polling.

Go to Settings → General → Background App Refresh and confirm KTMNav is toggled ON.

Pass Criteria: Lock your iPhone screen, put it in your pocket, walk 50–100 meters, and verify the remaining distance on the bike decrements continuously.

4. Bluetooth Dual-Profile Conflicts (Audio vs Telemetry)
The Bug: KTM consoles can pair as both a Hands-Free Audio Headset (Bluetooth Classic) and a Data Unit (BLE BCCU). If old pairing keys remain, the bike may accept calls but drop navigation commands.

How to Fix:

On the bike's handlebar menu, go to Settings → Bluetooth → Phone and delete any stale device pairings.

Pair freshly through KTMNav so the BCCU registers the active navigation channel.

5. Complex Maneuver Glyph Mismatches
The Bug: Complex maneuvers (like a 3rd exit on a multi-lane roundabout or a highway fork) sending an unmapped opcode can cause the TFT to render a blank black box.

How to Test:

Open KTMNav → Dashboard → TFT Dashboard Tester.

Tap through the buttons (Roundabout 1–8, Sharp Turn, U-Turn, Highway Exit).

Confirm that the physical TFT screen changes icon correctly for each tap.

6. 7-Day Personal Certificate Expiration
The Bug: Apps sideloaded with a free personal Apple ID expire after 7 days, displaying "KTMNav is No Longer Available" when opened.

How to Prevent It:

In Sideloadly on your laptop, click Advanced Options and turn on Wi-Fi Sideloading.

Whenever your laptop and iPhone share the same home Wi-Fi network, Sideloadly will automatically refresh the signature in the background without needing a USB cable.

7. Standstill / Red-Light Keep-Alive Drops
The Bug: At long signals or railway crossings, GPS speed drops to 0 km/h. If no packets are sent for 10–15 seconds, the KTM dash assumes the app has disconnected and reverts to the default speedometer/clock screen.

How KTMNav Prevents This:

The app runs a continuous 2.5-second keepalive timer (sendHeartbeat()) that sends an idle ping frame over BLE regardless of whether you are moving, ensuring the dash stays locked on the navigation screen.

Part 3: Viewing Live Debug Logs on Windows
If you run into an unexpected disconnect or a refusal to pair, you can inspect real-time system logs:

In-App Logs: Go to Settings → Diagnostics & Live Logs inside KTMNav to view timestamped BLE discovery packets, GATT handshake states, and CoreLocation updates. Tap Copy Logs to paste them into Notes.

Live USB Console via Sideloadly: Connect your iPhone to your Windows laptop, open Sideloadly, expand the bottom log pane, and filter for CoreBluetooth or KTMNav to watch real-time packet transmissions as you bench-test.

