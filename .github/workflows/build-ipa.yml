name: Build KTMNav IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Build and Package iOS IPA
        run: |
          set -e
          echo "=== 1. Finding Source Files ==="
          PLIST_PATH=$(find . -name "Info.plist" | head -n 1)
          if [ -z "$PLIST_PATH" ]; then
            echo "Error: Info.plist not found in repository!"
            exit 1
          fi
          echo "Found Info.plist at: $PLIST_PATH"

          SWIFT_FILES=$(find . -name "*.swift" -not -path "*/.*")
          echo "Found Swift files:"
          echo "$SWIFT_FILES"

          echo "=== 2. Creating App Bundle Structure ==="
          mkdir -p build/Payload/KTMNav.app
          cp "$PLIST_PATH" build/Payload/KTMNav.app/Info.plist

          echo "=== 3. Compiling Swift Directly to iOS Binary ==="
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -emit-executable \
            -o build/Payload/KTMNav.app/KTMNav \
            $SWIFT_FILES

          echo "=== 4. Packaging into IPA ==="
          cd build
          zip -r KTMNav.ipa Payload/
          ls -lh KTMNav.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: KTMNav-IPA
          path: build/KTMNav.ipa
          retention-days: 30
