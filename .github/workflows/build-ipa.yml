name: Build KTMNav IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Build and Package iOS IPA
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess, shutil, zipfile, base64, io

          print('=== 1. Extracting Full KTMNav Codebase ===')
          payload_b64 = """"""
          zip_data = base64.b64decode(payload_b64)
          with zipfile.ZipFile(io.BytesIO(zip_data)) as z:
              z.extractall('extracted_app')

          print('Extracted project files successfully.')

          print('=== 2. Locating SDK ===')
          sdk_path = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path']).decode().strip()
          print(f'iPhoneOS SDK: {sdk_path}')

          print('=== 3. Setting Up App Bundle ===')
          app_dir = os.path.join('build', 'Payload', 'KTMNav.app')
          os.makedirs(app_dir, exist_ok=True)
          
          # Find and copy Info.plist
          plist_path = None
          for r, d, files in os.walk('extracted_app'):
              if 'Info.plist' in files:
                  plist_path = os.path.join(r, 'Info.plist')
                  break
          shutil.copy(plist_path, os.path.join(app_dir, 'Info.plist'))

          print('=== 4. Collecting Swift Sources ===')
          swift_files = []
          for r, d, files in os.walk('extracted_app'):
              for f in files:
                  if f.endswith('.swift') and f != 'Package.swift':
                      swift_files.append(os.path.join(r, f))
          print(f'Compiling {len(swift_files)} Swift source files...')

          print('=== 5. Compiling iOS ARM64 Binary ===')
          output_bin = os.path.join(app_dir, 'KTMNav')
          compile_cmd = [
              'xcrun', '--sdk', 'iphoneos', 'swiftc',
              '-target', 'arm64-apple-ios16.0',
              '-sdk', sdk_path,
              '-module-name', 'KTMNav',
              '-parse-as-library',
              '-O',
              '-emit-executable',
              '-framework', 'Foundation',
              '-framework', 'UIKit',
              '-framework', 'SwiftUI',
              '-framework', 'MapKit',
              '-framework', 'CoreLocation',
              '-framework', 'CoreBluetooth',
              '-framework', 'AVFoundation',
              '-o', output_bin
          ] + swift_files

          subprocess.check_call(compile_cmd)
          print('Compilation Succeeded!')

          print('=== 6. Packaging into KTMNav.ipa ===')
          ipa_path = os.path.join('build', 'KTMNav.ipa')
          with zipfile.ZipFile(ipa_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for r, d, files in os.walk('build/Payload'):
                  for f in files:
                      abs_file = os.path.join(r, f)
                      rel_file = os.path.relpath(abs_file, 'build')
                      zipf.write(abs_file, rel_file)

          size_mb = os.path.getsize(ipa_path) / (1024 * 1024)
          print(f'DONE: KTMNav.ipa generated successfully ({size_mb:.2f} MB)')
          EOF

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: KTMNav-IPA
          path: build/KTMNav.ipa
          retention-days: 30
