How It Works & iOS Architecture
Unlike Android—where third-party apps scrape Google Maps notifications using background listener services—Apple's iOS sandbox prohibits apps from reading other apps' notifications. To deliver a seamless, subscription-free experience on iPhone, KTMNav combines an on-device navigation engine with a reverse-engineered KTM BCCU protocol driver:

Native On-Device Navigation Engine (NavigationEngine.swift): Built directly on Apple's MapKit and CoreLocation. It computes optimal road routes, monitors GPS progress every 2 meters, detects step completions, handles off-route deviations (>45 m) with instant rerouting, and offers optional helmet audio guidance via AVSpeechSynthesizer—all running 100% locally and free.

KTM BCCU Bluetooth Driver (KTMBluetoothManager.swift): Communicates with the motorcycle's Bluetooth Connectivity Control Unit (BCCU) across Gen-2 and Gen-3 TFT clusters (primary GATT Service 0000FE20-0000-1000-8000-00805F9B34FB). It handles connection state restoration, periodic keep-alive pings (every 2.5s) to avoid dash timeouts, and packet serialization (Sync 0xAA 0x55, Opcode 0x10, CRC-16 checksum, and optional AES-128-CBC encryption).

Maneuver Glyph Mapping (KTMManeuver.swift): Translates turn instructions into the 58 native icon codes rendered by the bike's TFT cluster (straight, slight/standard/sharp turns, roundabouts with exit numbers 1–8, highway forks/ramps, U-turns, and arrival flags).

Pocket & Locked-Screen Background Execution: Configured with UIBackgroundModes: ["location", "bluetooth-central", "processing"] so you can lock your iPhone and stow it safely in your jacket or tank bag—protecting your phone's camera optical image stabilization (OIS) from engine vibration.

Instant Auto-Reconnect: Stores your bike's peripheral identifier in UserDefaults and re-establishes the telemetry link within ~1 second whenever you cycle the motorcycle's ignition key.

